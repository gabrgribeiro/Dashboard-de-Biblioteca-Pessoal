<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Library - Biblioteca</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/biblioteca.css">
</head>
<body>
    <header class="header">
        <h1>Minha Biblioteca</h1>

        <div class="header-actions">
            <span>👤 Gabriel</span>
        </div>
    </header>

    <nav class="menu">
        <div class="menu-logo">
            <span>📚</span>
            <h2>Personal Library</h2>
        </div>

        <ul>
            <li>
                <a href="../index.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a class="active" href="biblioteca.html">
                    📖 Biblioteca
                </a>
            </li>

            <li>
                <a href="estatisticas.html">
                    📊 Estatísticas
                </a>
            </li>
        </ul>

        <div class="menu-add">
            <button id="btnAdicionar" type="button">
                ＋ Adicionar livro
            </button>
        </div>

        <div class="menu-settings">
            <a href="#">
                ⚙ Configurações
            </a>
        </div>
    </nav>

    <main class="main">
        <section class="library">
            <div class="page-header">
                <div>
                    <h2>Biblioteca</h2>
                    <p>Todos os seus livros.</p>
                </div>

                <button id="btnAdicionar" class="btn-add" type="button">
                    ＋ Adicionar livro
                </button>
            </div>

            <div class="filters">
                <input
                    id="searchBook"
                    type="search"
                    placeholder="Pesquisar livro..."
                >

                <select id="statusFilter">
                    <option value="todos">Todos</option>
                    <option value="quero-ler">Quero ler</option>
                    <option value="lendo">Lendo</option>
                    <option value="lido">Lido</option>
                    <option value="abandonado">Abandonado</option>
                </select>

                <select id="sortBooks">
                    <option value="titulo">Título</option>
                    <option value="autor">Autor</option>
                    <option value="nota">Nota</option>
                    <option value="progresso">Progresso</option>
                </select>
            </div>

            <div
                class="book-grid"
                id="bookGrid"
            ></div>
        </section>
    </main>

    <div
        class="modal-overlay"
        id="bookModal"
    >
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">
                    Adicionar livro
                </h2>

                <button
                    id="btnFecharModal"
                    type="button"
                >
                    &times;
                </button>
            </div>

            <form id="bookForm">
                <div class="form-group">
                    <label for="titulo">
                        Título
                    </label>

                    <input
                        id="titulo"
                        type="text"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="autor">
                        Autor
                    </label>

                    <input
                        id="autor"
                        type="text"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="genero">
                            Gênero
                        </label>

                        <input
                            id="genero"
                            type="text"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="paginas">
                            Páginas
                        </label>

                        <input
                            id="paginas"
                            type="number"
                            min="1"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">
                        Status
                    </label>

                    <select id="status">
                        <option value="quero-ler">
                            Quero ler
                        </option>

                        <option value="lendo">
                            Lendo
                        </option>

                        <option value="lido">
                            Lido
                        </option>

                        <option value="abandonado">
                            Abandonado
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nota">
                        Nota
                    </label>

                    <input
                        id="nota"
                        type="number"
                        min="0"
                        max="10"
                        step="0.1"
                        value="0"
                    >
                </div>

                <div class="form-group">
                    <label for="capa">
                        URL da capa
                    </label>

                    <input
                        id="capa"
                        type="url"
                        placeholder="https://..."
                    >
                </div>

                <div class="form-group">
                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        rows="4"
                    ></textarea>
                </div>

                <div class="modal-actions">
                    <button
                        id="btnCancelar"
                        class="secondary-button"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        id="btnSalvarLivro"
                        class="primary-button"
                        type="submit"
                    >
                        Salvar livro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>
            Personal Library &copy; 2026
        </p>
    </footer>

    <script src="../js/dados.js"></script>
    <script src="../js/biblioteca.js"></script>
</body>
</html>
